# Runs the offline checks on Linux, macOS and Windows. No model session is started: these are the
# checks a visitor can run without Claude Code. The re-run itself needs a signed-in Claude Code.
name: Offline checks

on:
  push:
    branches: [main, ci-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node verify/check.mjs
        run: node verify/check.mjs
      - name: node verify/history.mjs
        run: node verify/history.mjs
      - name: node verify/folder.mjs
        run: node verify/folder.mjs
      - name: node verify/selftest.mjs
        run: node verify/selftest.mjs
